:root{
  --grad:linear-gradient(180deg,#0A1820 0%,#10242C 28%,#1C343D 58%,#30484F 82%,#5E6560 94%,#8A7D66 100%);
  --ink:#EEF0EE; --ink-2:#C9D2D4; --mute:#A3B2B6; --faint:#7F9196;
  --line:rgba(241,241,241,.14); --line-2:rgba(241,241,241,.08);
  --veil:rgba(241,241,241,.055); --veil-2:rgba(241,241,241,.1);
  --panel:rgba(9,22,29,.6); --bar:rgba(9,21,28,.94);
  --acc:#E6D9BF; --acc-ink:#0B1A21; --acc-soft:rgba(230,217,191,.13);
  --ok:#8FC0B2; --ok-soft:rgba(143,192,178,.14); --warn:#D9C190; --warn-soft:rgba(217,193,144,.14);
  --bad:#E39C93; --bad-soft:rgba(227,156,147,.14); --opp:#A9C6D4; --opp-soft:rgba(169,198,212,.14);
  --f:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  --fd:"BW","Readex Pro",Tahoma,sans-serif;
  --r:14px; --r-lg:24px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#0B1A21;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:var(--grad);z-index:-1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
[hidden]{display:none!important}
.num,.tnum{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--mute)}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:640px;margin:0 auto;padding:14px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.logo{display:block;height:30px;width:auto;color:var(--ink);flex:none}
.logo svg{height:100%;width:auto;display:block}
.top-meta{font-size:12.5px;color:var(--mute);text-align:left;line-height:1.5;min-width:0}
.top-meta b{color:var(--ink);font-weight:500;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.px{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.px i{display:block;aspect-ratio:1;background:rgba(241,241,241,.12);border-radius:2px}
.px i.on{background:var(--acc)}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.steps button{appearance:none;background:none;border:0;border-top:2px solid var(--line);padding:6px 0 0;font-size:11.5px;color:var(--faint);cursor:pointer;text-align:start;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.done{border-top-color:var(--acc);color:var(--mute)}
.steps button[aria-current="step"]{border-top-color:var(--ink);color:var(--ink);font-weight:500}

/* page column */
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:8px 140px}
.screen-h{padding-block:34px 8px;display:grid;gap:8px}
.eyebrow{font-size:12.5px;color:var(--acc);letter-spacing:.02em}
h1,h2{font-family:var(--fd);font-weight:300;margin:0;line-height:1.25;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(34px,8vw,48px)}
h2{font-size:clamp(26px,6vw,32px)}
.lede{color:var(--ink-2);font-size:16.5px;margin:0;max-width:56ch;text-wrap:pretty}

/* welcome */
.hero{padding-block:28px 6px;display:grid;gap:18px}
#sym{width:132px;height:120px;display:block}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:6px}
.fact{display:grid;gap:0}
.fact b{font-family:var(--fd);font-weight:300;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--mute)}
.howto{list-style:none;margin:30px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.howto li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.howto li span{font-family:var(--fd);color:var(--acc);font-size:15px}
.howto li b{color:var(--ink);font-weight:500}
.prop-pill{display:flex;gap:12px;align-items:center;margin-top:22px;padding:14px 16px;border-radius:var(--r);background:var(--veil);border:1px solid var(--line)}
.prop-pill .c{font-size:12.5px;color:var(--acc)}
.prop-pill b{font-weight:500;display:block}

/* question blocks */
.q{padding-block:30px;border-bottom:1px solid var(--line-2);scroll-margin-top:170px}
.q:last-child{border-bottom:0}
.q.miss .q-t{color:var(--bad)}
.q-h{display:flex;gap:12px;align-items:baseline}
.q-n{font-family:var(--fd);font-size:14px;color:var(--acc);min-width:20px;font-variant-numeric:tabular-nums}
.q-t{font-size:18px;font-weight:500;margin:0;line-height:1.55;text-wrap:pretty}
.help{font-size:14px;color:var(--mute);margin:6px 0 0;padding-inline-start:32px;line-height:1.7}
.ctl{margin-top:16px;padding-inline-start:32px}
.sub{margin-top:20px;margin-inline-start:32px;padding-inline-start:16px;border-inline-start:2px solid rgba(230,217,191,.45);display:grid;gap:20px}
.lbl{display:block;font-size:14.5px;font-weight:500;margin-bottom:10px}
.lbl small{font-weight:400;color:var(--faint);margin-inline-start:6px;font-size:12.5px}
.note{font-size:13.5px;color:var(--mute);margin:0;line-height:1.7}
.note.warn{color:var(--warn)}
.req{color:var(--bad)}
@media (max-width:420px){.help,.ctl{padding-inline-start:0}.sub{margin-inline-start:0}}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:52px;padding:8px 12px;border:1px solid var(--line);background:var(--veil);font-size:15.5px;cursor:pointer;border-radius:var(--r);transition:background .15s,border-color .15s,color .15s}
.seg button:hover{border-color:rgba(230,217,191,.55)}
.seg button[aria-checked="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}
.seg.sm button{min-height:44px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:7px 15px;border:1px solid var(--line);background:var(--veil);font-size:14.5px;border-radius:999px;cursor:pointer;text-align:start;line-height:1.45;transition:background .15s,border-color .15s}
.chip:hover{border-color:rgba(230,217,191,.55)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.chip[aria-pressed="true"]::before{content:"✓";margin-inline-end:7px;font-weight:600}
.chip small{display:block;font-size:12px;color:var(--faint)}
.chip.alert[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.units .chip{border-radius:12px;min-height:40px;padding:4px 0;text-align:center;font-size:13.5px;direction:ltr}
.units .chip[aria-pressed="true"]::before{content:none}
.units .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.ucount{font-size:13.5px;color:var(--mute);margin-top:10px}
.ucount b{color:var(--ink);font-weight:500}

.fld{display:grid;gap:8px;font-size:14.5px;font-weight:500}
.fld .cur{font-weight:400;color:var(--faint);font-size:12.5px}
.fld input,.fld textarea,.fld select{font-size:16px;font-weight:400;color:var(--ink);background:var(--veil);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:52px;width:100%}
.fld textarea{min-height:92px;resize:vertical;line-height:1.65}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(230,217,191,.18)}
.fld .count{font-size:12px;color:var(--faint);font-weight:400;text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

.up{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.up-btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border:1px dashed rgba(230,217,191,.6);color:var(--acc);cursor:pointer;font-size:14.5px;border-radius:var(--r);background:var(--veil)}
.up-btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.up-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.up-btn svg{width:17px;height:17px;flex:none}
.file{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;max-width:100%;min-width:0;background:var(--veil);border-radius:12px;padding:4px 6px 4px 4px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.file img,.file .ic{width:38px;height:38px;object-fit:cover;flex:none;border-radius:9px;background:var(--veil-2);display:grid;place-items:center;color:var(--mute)}
.x{appearance:none;border:0;background:none;color:var(--mute);cursor:pointer;font-size:19px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--bad)}

.docs{display:grid}
.doc{display:grid;gap:10px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.doc:first-child{padding-top:0}
.doc:last-child{border-bottom:0}
.doc-n{font-size:15.5px;font-weight:500;line-height:1.5}
.doc-n small{display:block;font-weight:400;font-size:12.5px;color:var(--faint)}

.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shot{aspect-ratio:1;position:relative;background:var(--veil);border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mute);overflow:hidden;line-height:1.5}
.shot.add{cursor:pointer;border-color:rgba(230,217,191,.6);color:var(--acc)}
.shot.add:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.shot.add input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.shot.add b{display:block;font-size:26px;font-weight:200;line-height:1}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .x{position:absolute;top:6px;inset-inline-end:6px;background:rgba(9,21,28,.75);color:#fff;width:28px;height:28px;padding:0;border-radius:50%}
.shot-label{font-size:14.5px;font-weight:500;margin:0 0 10px}
.shot-label small{font-weight:400;color:var(--faint);margin-inline-start:6px}

.ack{display:flex;gap:14px;align-items:flex-start;cursor:pointer;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--veil);width:100%;text-align:start;font-size:15.5px;line-height:1.7}
.ack .box{width:24px;height:24px;border:1.5px solid var(--acc);border-radius:7px;flex:none;display:grid;place-items:center;margin-top:2px;color:var(--acc-ink)}
.ack[aria-checked="true"] .box{background:var(--acc)}
.meta-auto{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;margin:16px 0 0}
.meta-auto dt{color:var(--mute)}
.meta-auto dd{margin:0}

/* property card */
.pcard{margin-top:26px;padding:20px 20px 16px;border-radius:var(--r-lg);background:var(--panel);border:1px solid var(--line)}
.pcard .top2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--mute)}
.pcard .top2 .c{color:var(--acc)}
.pcard h3{margin:6px 0 14px;font-family:var(--fd);font-weight:300;font-size:22px;line-height:1.35}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14.5px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.kv dd small{font-weight:400;color:var(--faint);margin-inline-start:6px;font-size:12px}
.maplink{display:inline-flex;gap:6px;margin-top:14px;font-size:14px;color:var(--acc);text-underline-offset:4px}

/* picker */
.pick-list{list-style:none;margin:10px 0 0;padding:0;max-height:340px;overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:rgba(9,21,28,.5)}
.pick-list li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:76px 1fr;gap:10px;width:100%;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line-2);font-size:14.5px}
.pick-list li button:hover,.pick-list li button:focus-visible{background:var(--veil-2)}
.pick-list li button .c{color:var(--acc);font-size:13px;direction:ltr;text-align:right}
.pick-list li button small{display:block;color:var(--faint);font-size:12.5px}
.pick-empty{padding:14px;color:var(--mute);font-size:14px}

/* bottom action bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:640px;margin:0 auto;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.bar-note{font-size:12.5px;color:var(--mute);flex:1;min-width:0;line-height:1.5}
.btn{min-height:52px;padding:0 22px;font-size:15.5px;border-radius:var(--r);cursor:pointer;border:1px solid var(--line);background:var(--veil);white-space:nowrap}
.btn:hover{border-color:rgba(230,217,191,.55)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500;flex:1}
.btn.pri:hover{filter:brightness(1.04)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:none}
.linkbtn{appearance:none;background:none;border:0;padding:2px 0;color:var(--acc);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:14px}

/* review */
.missing{margin:22px 0 0;padding:18px;border-radius:var(--r-lg);background:var(--bad-soft);border:1px solid rgba(227,156,147,.35)}
.missing b{display:block;color:var(--bad);font-weight:500;margin-bottom:10px}
.missing ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.missing button{appearance:none;border:1px solid rgba(227,156,147,.6);background:none;color:var(--ink);font-size:13.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.rv-sec{padding-block:24px;border-bottom:1px solid var(--line-2)}
.rv-sec h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 12px;font-size:16px;font-weight:500}
.rv-sec h3 .no{font-family:var(--fd);color:var(--acc);font-size:13px;margin-inline-end:10px}
.dl{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);margin:0}
.dl dt,.dl dd{padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14.5px;margin:0}
.dl dt{color:var(--mute);padding-inline-end:16px}
.dl dd{min-width:0;overflow-wrap:anywhere}
.dl dd small{display:block;color:var(--mute);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:7px;height:7px;background:currentColor;border-radius:2px;flex:none}
.pill.ready{background:var(--ok-soft);color:var(--ok)}
.pill.notes{background:var(--warn-soft);color:var(--warn)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--veil-2);color:var(--ink-2)}
.flags{display:grid}
.flag{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:start;font-size:14.5px;line-height:1.6}
.flag .sv{align-self:stretch;background:var(--faint);border-radius:2px}
.flag.red .sv{background:var(--bad)} .flag.amber .sv{background:var(--warn)} .flag.opp .sv{background:var(--opp)}
.flag .team{font-size:12.5px;color:var(--mute);white-space:nowrap}
.empty{font-size:14.5px;color:var(--mute);padding:8px 0;margin:0}

/* chain */
.chain{list-style:none;margin:18px 0 0;padding:0;display:grid}
.chain li{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:22px}
.chain li::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.chain li:last-child::before{display:none}
.chain .dot{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute);background:rgba(9,21,28,.6)}
.chain li.done .dot{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chain li.now .dot{border-color:var(--acc);color:var(--acc)}
.chain li.back .dot{border-color:var(--bad);color:var(--bad)}
.chain b{font-weight:500;display:block;line-height:1.5}
.chain small{color:var(--mute);font-size:13px;display:block;line-height:1.6}

/* sending / done */
.center{min-height:60vh;display:grid;align-content:center;gap:18px;padding-block:40px}
.ref{font-family:var(--fd);font-size:30px;font-weight:300;direction:ltr;text-align:right}
.bar-prog{height:6px;border-radius:999px;background:var(--veil-2);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .3s}
.toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;max-width:520px;margin:0 auto;padding:14px 18px;border-radius:var(--r);background:#14262E;border:1px solid var(--line);color:var(--ink);font-size:14.5px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.toast.err{border-color:rgba(227,156,147,.6)}
.preview-ribbon{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 12px;display:inline-block}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- card layout (the phone card from the prototype) ---------- */
.stage{min-height:100vh;padding:28px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:start}
.card{width:100%;min-width:0;max-width:480px;background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.c-head{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 20px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.c-brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.c-brand .logo{height:26px}
.c-brand small{font-size:12px;color:var(--mute)}
.ex-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 20px;background:var(--warn-soft);color:var(--warn);font-size:13px;flex-wrap:wrap}
.ph-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.ph-row .code{color:var(--ink);font-weight:500}
.ph-row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode{display:inline-flex;background:var(--veil);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.mode button{appearance:none;border:0;background:none;color:var(--mute);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mode button[aria-checked="true"]{background:var(--acc);color:var(--acc-ink);font-weight:500}
.ph-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ph-title h2{font-family:var(--f);font-weight:500;font-size:18px;line-height:1.4}
.ph-title .pct{font-family:var(--fd);font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--acc)}
.c-body{padding:0 20px}
.c-foot{position:sticky;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:0 0 22px 22px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.c-body .q{padding-block:24px}
.c-body .help,.c-body .ctl{padding-inline-start:28px}
.c-body .sub{margin-inline-start:28px}
.stephd{display:flex;align-items:baseline;gap:12px;padding:30px 0 4px;border-top:1px solid var(--line)}
.stephd.first{border-top:0}
.stephd .no{font-family:var(--fd);font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums}
.stephd h3{margin:0;font-family:var(--fd);font-size:20px;font-weight:300}
.when{margin:0 0 2px;font-size:12px;color:var(--acc)}
.intro{padding-block:26px 6px;display:grid;gap:14px}
.intro h1{font-size:34px}
.intro p{margin:0;color:var(--ink-2)}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpis div{display:grid}
.kpis b{font-family:var(--fd);font-weight:300;font-size:24px;line-height:1.2}
.kpis span{font-size:12.5px;color:var(--mute)}
.upbox{margin-top:4px;padding:18px;border-radius:18px;background:var(--veil);border:1px solid var(--line);display:grid;gap:14px}
.upbox ol{margin:0;padding:0 18px 0 0;display:grid;gap:6px;font-size:14.5px}
.upbox ol li::marker{color:var(--acc)}
.upbox .tip{font-size:13.5px;color:var(--ink-2);line-height:1.8;background:rgba(9,21,28,.45);border-radius:12px;padding:12px 14px}
.upbox .tip b{color:var(--acc);font-weight:500}
.btn-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);font-weight:500;text-decoration:none;font-size:15px}
.btn-link.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.fbox{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;height:min(72vh,720px)}
.fbox iframe{width:100%;height:100%;border:0;display:block}
.steps-note{font-size:13.5px;color:var(--ink-2);display:grid;gap:8px;margin:0;padding:0 18px 0 0}
@media (max-width:560px){
  .stage{padding:0}
  .card{max-width:none;border-radius:0;border:0;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
  .c-head{border-radius:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .c-foot{border-radius:0;position:fixed;inset:auto 0 0 0}
  .c-body{padding-bottom:110px}
  .c-body .help,.c-body .ctl{padding-inline-start:0}
  .c-body .sub{margin-inline-start:0}
}

/* ---------- report page ---------- */
.r-in{max-width:880px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.r-head{padding-block:calc(26px + env(safe-area-inset-top,0px)) 26px;border-bottom:1px solid var(--line)}
.r-head .r-in{display:grid;gap:12px}
.r-head .c-brand{margin-bottom:18px}
.r-meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px}
main.r-in{padding-block:6px 60px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 34px}
.team h4{margin:12px 0 2px;font-size:13.5px;font-weight:500;color:var(--mute)}
.r-foot{font-size:12.5px;color:var(--faint);margin-top:30px;line-height:1.8}
.send-row{display:flex;flex-wrap:wrap;gap:8px}
.send-row .btn-link,.send-row .btn{flex:1 1 140px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px}
.edit-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 20px;background:var(--acc-soft);color:var(--acc);font-size:13px;flex-wrap:wrap}
.edits{display:grid;margin:0;padding:0;list-style:none}
.edits li{padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px;line-height:1.7}
.edits li b{font-weight:500}
.edits .f{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(227,156,147,.7)}
.edits .t{color:var(--acc)}
.panel{margin-top:10px;padding:22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:grid;gap:18px}
.panel h3{margin:0;font-family:var(--fd);font-weight:300;font-size:22px}
.panel .who{font-size:13.5px;color:var(--mute)}
.chain li.back .dot{border-color:var(--bad);color:var(--bad)}
.chain .note-q{display:block;margin-top:4px;color:var(--ink-2);font-size:13.5px;background:var(--veil);border-radius:10px;padding:6px 10px}
.panel .note-q{display:block;color:var(--ink-2);font-size:14px;background:var(--veil);border-radius:12px;padding:10px 14px;line-height:1.7}
.panel .btn-link.ghost{justify-self:start}
.panel .btn.pri{flex:none;width:100%}
.panel .seg{max-width:420px}
@media (max-width:520px){.panel{padding:18px}.panel .btn-link.ghost{justify-self:stretch}}
</style>
</head>

   <div class="ph-title"><h2>${title}</h2><span class="pct num">${p.pct}%</span></div>

   <div class="steps" style="grid-template-columns:repeat(7,minmax(0,1fr))">${tabs}</div></div>`;

  } else if (S.screen === 'form') {

      body = secStart() + (S.code ? SECS.map((fn, i) => `<div class="stephd" id="st-${i}"><span class="no">${String(i + 1).padStart(2, '0')}</span><h3>${N.STEPS[i].t}</h3></div>` + fn()).join('') : '');

      foot = `<button type="button" class="btn" data-act="prev" ${S.step < 0 ? 'disabled' : ''}>السابق</button><button type="button" class="btn pri" data-act="${last ? 'review' : 'next'}">${last ? 'مراجعة وإرسال' : 'التالي: ' + TABS[S.step + 2].s}</button>`;

/* ---------- sending: build the report link and the pre-filled Microsoft Form ---------- */
function newRef(P) { const d = new Date(), z = n => String(n).padStart(2, '0'); const c = P && /^NMO-\d+$/.test(P.code) ? P.code.slice(4) : 'X'; return `R-${c}-${String(d.getFullYear()).slice(2)}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; }
async function prepareSend() {
  const P = prop();
  if (!S.ref) S.ref = newRef(P);
  const R = { v: 1, ref: S.ref, at: new Date().toISOString(), chain: [], sup: S.sup, prop: P ? { code: P.code, name: P.name, district: P.district, type: P.type, units: P.units, lat: P.lat, lng: P.lng, unitList: P.unitList } : null, A: S.A };
  const link = CFG.reportUrl + '#d=' + await N.pack(R);
  const vals = N.formsFields(Object.assign({}, R, { link }));
  const LIMIT = 7800, base = CFG.formsBase + CFG.formId;
  const build = v => { const fv = {}; Object.keys(CFG.qmap).forEach(k => { if (v[k]) fv[CFG.qmap[k]] = String(v[k]); }); return encodeURIComponent(JSON.stringify(fv)); };
  let trimmed = false, enc = build(vals);
  const order = ['notes', 'docs', 'mnt', 'opp', 'off', 'verify', 'viol', 'vac', 'teams', 'arr', 'waqf', 'meters', 'files'];
  let guard = 0;
  while ((base + '&embed=true&formValue=' + enc).length > LIMIT && guard++ < 60) {
    const k = order.filter(x => vals[x] && vals[x].length > 12).sort((a, b) => vals[b].length - vals[a].length)[0];
    if (!k) { vals.link = ''; enc = build(vals); trimmed = true; break; }
    vals[k] = vals[k].slice(0, Math.max(10, Math.floor(vals[k].length * 0.6))) + '…'; trimmed = true; enc = build(vals);
  }
  sendInfo = { embed: base + '&embed=true&formValue=' + enc, open: base + '&formValue=' + enc, link: vals.link ? link : '', trimmed, len: (base + '&embed=true&formValue=' + enc).length };
  S.sent[S.code] = Object.assign({}, S.sent[S.code] || {}, { ref: S.ref, link, pending: true });
  save();
}

  const b = e.target.closest('[data-step],[data-set],[data-toggle],[data-act],[data-jump],[data-pick-code]'); if (!b) return;
  if (b.dataset.pickCode) { const c = b.dataset.pickCode; if (S.code && S.code !== c) S.drafts[S.code] = { A: S.A, at: Date.now() }; S.code = c; S.A = Object.assign(N.blank(), (S.drafts[c] && S.drafts[c].A) || {}); S.ref = ''; pickQ = ''; save(); rerender(); return; }
  if (b.dataset.step != null && b.closest('.steps')) { const st = +b.dataset.step; S.screen = 'form'; if (S.full) { render(); const h = st < 0 ? $('#body') : $('#st-' + st); if (h) h.scrollIntoView({ block: 'start' }); else toTop(); } else { S.step = st; save(); render(); toTop(); } return; }
  if (b.dataset.set) { const p = b.dataset.set, v = b.dataset.val; const optional = ['A.vacReason']; setPath(p, (optional.includes(p) && getPath(p) === v) ? '' : v); save(); rerender(`[data-set="${cssq(p)}"][data-val="${cssq(v)}"]`); return; }
  if (b.dataset.toggle) { const p = b.dataset.toggle, v = b.dataset.val; const a = (getPath(p) || []).slice(); const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); if (/Units$/.test(p)) a.sort(); setPath(p, a); save(); rerender(`[data-toggle="${cssq(p)}"][data-val="${cssq(v)}"]`); return; }
  if (b.dataset.jump != null) { const st = +b.dataset.jump; S.screen = 'form'; if (!S.full) S.step = st; showMissing = true; render(); const el = (b.dataset.id && $('#q-' + b.dataset.id)) || $('#st-' + st); if (el) el.scrollIntoView({ block: 'start' }); else toTop(); return; }
  const act = b.dataset.act;
  if (act === 'full' || act === 'stepwise') { S.full = act === 'full'; save(); render(); toTop(); }
  else if (act === 'next') { S.step = Math.min(5, S.step + 1); if (S.step >= 0 && !S.code) { S.step = -1; showMissing = true; toast('اختر العقار أولاً.', true); } save(); render(); toTop(); }
  else if (act === 'prev') { S.step = Math.max(-1, S.step - 1); save(); render(); toTop(); }
  else if (act === 'unpick') { if (S.code) S.drafts[S.code] = { A: S.A, at: Date.now() }; S.code = ''; save(); rerender('#pick-q'); }
  else if (act === 'ack') { S.A.ack = !S.A.ack; save(); rerender('[data-act="ack"]'); }
  else if (act === 'urgent') { S.A.mntUrgent = !S.A.mntUrgent; save(); rerender('[data-act="urgent"]'); }
  else if (act === 'review') { S.screen = 'review'; showMissing = true; save(); render(); toTop(); }
  else if (act === 'edit') { S.screen = 'form'; save(); render(); toTop(); }
  else if (act === 'send') { if (prog().missing.length) return; sendInfo = null; S.screen = 'send'; render(); toTop(); try { await prepareSend(); } catch (err) { toast('تعذّر تجهيز الإرسال. حاول مرة أخرى.', true); S.screen = 'review'; } render(); toTop(); }
  else if (act === 'sent') { S.sent[S.code] = Object.assign({}, S.sent[S.code] || {}, { pending: false, at: new Date().toISOString() }); S.screen = 'done'; save(); render(); toTop(); }
  else if (act === 'another') { if (S.code) delete S.drafts[S.code]; S.code = ''; S.A = N.blank(); S.ref = ''; S.step = -1; S.screen = 'form'; showMissing = false; sendInfo = null; save(); render(); toTop(); }
  else if (act === 'edit-cancel') { location.href = CFG.reportUrl + '#d=' + EDIT.d; }
  else if (act === 'edit-save') { const miss = prog().missing; if (miss.length) { showMissing = true; rerender(); UI.toast('أكمل البنود الناقصة قبل الحفظ: ' + miss.slice(0, 3).map(m => m.label).join('، '), true); return; } const P = prop(); const d = N.diffA(EDIT.orig, S.A, P); const R2 = Object.assign({}, EDIT.R, { A: S.A }); const prev = (EDIT.R.pend && EDIT.R.pend.s === EDIT.stage) ? EDIT.R.pend.edits : []; const merged = prev.map(x => Object.assign({}, x)); d.forEach(x => { const m = merged.find(y => y.l === x.l); if (m) m.t = x.t; else merged.push(x); }); const fin = merged.filter(x => x.f !== x.t); R2.pend = fin.length ? { s: EDIT.stage, n: EDIT.name, edits: fin, at: new Date().toISOString() } : null; location.href = CFG.reportUrl + '#d=' + await N.pack(R2); }
  else if (act === 'geo') { const msg = $('#geoMsg'); const fail = () => { if (msg) msg.textContent = 'تعذّر تحديد الموقع. الصق الرابط يدوياً.'; }; try { if (!navigator.geolocation) return fail(); navigator.geolocation.getCurrentPosition(pos => { S.A.mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`; save(); rerender(); }, fail, { timeout: 9000 }); } catch (err) { fail(); } }
});
let inT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-pick]')) { pickQ = t.value; clearTimeout(inT); inT = setTimeout(() => rerender('#pick-q'), 120); return; }
  if (!t.dataset || !t.dataset.input) return;
  setPath(t.dataset.input, t.value); save();
  clearTimeout(inT); inT = setTimeout(updateHead, 120);
});

/* ---------- boot ---------- */
(async function boot() {
  const em = location.hash.match(/(?:^#|&)edit=([^&]+)/);
  if (em) { try { const d = decodeURIComponent(em[1]); const R = await N.unpack(d); const st = N.stageOf(R.chain); EDIT = { R, d, orig: Object.assign(N.blank(), R.A), stage: st, name: st === 0 ? (R.sup && R.sup.name || 'مشرف العقار') : N.holder(st) }; S = Object.assign(fresh(), { sup: R.sup || fresh().sup, code: R.prop ? R.prop.code : '', A: Object.assign(N.blank(), R.A), full: true, screen: 'form', step: 0 }); render(); return; } catch (e) { document.getElementById('card').innerHTML = '<div class="c-body"><div class="center"><h1>تعذّر فتح التقرير للتعديل</h1><p class="lede">الرابط ناقص أو تالف.</p></div></div>'; return; } }
  const qp = new URLSearchParams(location.search); const pc = (qp.get('p') || '').toUpperCase();
  if (pc && PROPS.some(p => p.code === pc) && S.code !== pc && S.screen === 'form') { if (S.code) S.drafts[S.code] = { A: S.A, at: Date.now() }; S.code = pc; S.A = Object.assign(N.blank(), (S.drafts[pc] && S.drafts[pc].A) || {}); }
  if (S.screen === 'send') S.screen = 'review';
  render();
})();
})();
